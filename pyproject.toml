[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-training-toolkit"
version = "0.1.0"
description = "Runtime patching and rollout diagnostics tools for VERL RL training"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
jupyter = ["ipython>=8", "jupyter>=1"]

[project.scripts]
rl-diagnostics = "rl_diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
