<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>训练方向监控与优化</title>
  <style>
    :root {
      --ink: #3b2020;
      --muted: #9a6868;
      --line: #ead0d0;
      --header: #fff1f1;
      --accent: #c93636;
      --canvas: #fffafa;
      --card: #ffffff;
      --table-font-size: 15px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--canvas);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
      line-height: 1.65;
    }

    .page {
      width: min(820px, calc(100% - 32px));
      margin: 36px auto;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--ink);
      font-size: 14px;
    }

    .font-size-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .font-size-control button,
    .font-size-control input {
      height: 34px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font: inherit;
    }

    .font-size-control button {
      display: inline-grid;
      width: 34px;
      padding: 0;
      place-items: center;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .font-size-control button:hover { border-color: var(--accent); }

    .font-size-control button:focus-visible,
    .font-size-control input:focus-visible {
      outline: 2px solid rgba(201, 54, 54, 0.28);
      outline-offset: 2px;
    }

    .font-size-control input {
      width: 58px;
      padding: 0 6px;
      border-radius: 6px;
      text-align: center;
    }

    .font-size-control .reset-button {
      width: auto;
      padding: 0 11px;
      font-size: 14px;
    }

    .font-size-unit { color: var(--muted); }

    .table-card {
      overflow: auto;
      width: 820px;
      height: 620px;
      min-width: 560px;
      min-height: 460px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 48px);
      resize: both;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(48, 71, 94, 0.07);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: var(--table-font-size);
      height: 100%;
    }

    thead th {
      padding: 17px 22px;
      color: #a82828;
      background: var(--header);
      border-bottom: 1px solid var(--line);
      font-size: calc(var(--table-font-size) + 1px);
      font-weight: 650;
      letter-spacing: 0.04em;
      text-align: left;
    }

    thead th:first-child { width: 20%; }
    thead th:nth-child(2) { width: 28%; }
    thead th:nth-child(3) { width: 28%; }
    thead th:nth-child(4) { width: 24%; }

    tbody th,
    tbody td {
      padding: 22px;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    tbody tr:last-child th,
    tbody tr:last-child td { border-bottom: 0; }

    tbody th {
      color: #a82828;
      background: #fffafa;
      font-size: calc(var(--table-font-size) + 1px);
      font-weight: 650;
    }

    tbody td + td,
    tbody th + td { border-left: 1px solid var(--line); }

    .items {
      display: grid;
      gap: 9px;
    }

    .item {
      position: relative;
      padding-left: 15px;
      color: var(--ink);
    }

    .item::before {
      position: absolute;
      top: 0.72em;
      left: 0;
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
      content: "";
    }

    .item.muted {
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .page { width: min(100% - 24px, 680px); margin: 24px auto; }
      .toolbar { justify-content: flex-start; }
      .table-card { overflow-x: auto; }
      table { min-width: 760px; }
      thead th, tbody th, tbody td { padding: 16px; }
      .table-card { min-width: 0; width: calc(100vw - 24px); height: 620px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="toolbar" role="toolbar" aria-label="表格显示设置">
      <span id="font-size-label">字体大小</span>
      <div class="font-size-control" aria-labelledby="font-size-label">
        <button type="button" id="decrease-font" title="减小字体" aria-label="减小字体">−</button>
        <input
          type="number"
          id="font-size-input"
          min="10"
          max="28"
          step="1"
          value="15"
          aria-label="字体大小（像素）"
        />
        <span class="font-size-unit">px</span>
        <button type="button" id="increase-font" title="增大字体" aria-label="增大字体">+</button>
        <button type="button" id="reset-font" class="reset-button">重置</button>
      </div>
    </div>
    <section class="table-card" aria-label="训练方向监控与优化表格" title="可拖动右下角调整表格宽高">
      <table>
        <thead>
          <tr>
            <th scope="col">方向</th>
            <th scope="col">监控</th>
            <th scope="col">识别 / 诊断</th>
            <th scope="col">建议 / 优化</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">训练效果方向</th>
            <td>
              <div class="items">
                <div class="item">原始训练日志与动态参数解析</div>
                <div class="item">step JSONL rollout 解析</div>
                <div class="item">Rollout 有效性与学习信号诊断</div>
              </div>
            </td>
            <td>
              <div class="items">
                <div class="item">无效 prompt 导出</div>
                <div class="item">训练稳定性诊断</div>
              </div>
            </td>
            <td>
              <div class="items">
                <div class="item">可选 difficulty 接入</div>
                <div class="item">贷后风控评测适配</div>
                <div class="item">数学评测适配</div>
                <div class="item">代码评测适配</div>
              </div>
            </td>
          </tr>
          <tr>
            <th scope="row">训练性能方向</th>
            <td>
              <div class="items">
                <div class="item">RL state timeline</div>
                <div class="item">Rollout server 指标</div>
                <div class="item">TransferQueue 指标</div>
                <div class="item">Host 与 device 指标</div>
              </div>
            </td>
            <td>
              <div class="items">
                <div class="item muted">异步异卡训推空泡识别与归因（待推进开发）</div>
              </div>
            </td>
            <td>
              <div class="items">
                <div class="item muted">训推资源配比与参数优化（待推进开发）</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <script>
    const defaultFontSize = 15;
    const minFontSize = 10;
    const maxFontSize = 28;
    const storageKey = "training-direction-table-font-size";
    const fontSizeInput = document.getElementById("font-size-input");

    function setFontSize(value) {
      const parsedValue = Number.parseInt(value, 10);
      const safeValue = Number.isFinite(parsedValue) ? parsedValue : defaultFontSize;
      const fontSize = Math.min(maxFontSize, Math.max(minFontSize, safeValue));

      document.documentElement.style.setProperty("--table-font-size", `${fontSize}px`);
      fontSizeInput.value = fontSize;
      localStorage.setItem(storageKey, fontSize);
    }

    fontSizeInput.addEventListener("input", () => {
      if (fontSizeInput.value !== "") setFontSize(fontSizeInput.value);
    });
    fontSizeInput.addEventListener("change", () => setFontSize(fontSizeInput.value));
    document.getElementById("decrease-font").addEventListener("click", () => {
      setFontSize(Number(fontSizeInput.value) - 1);
    });
    document.getElementById("increase-font").addEventListener("click", () => {
      setFontSize(Number(fontSizeInput.value) + 1);
    });
    document.getElementById("reset-font").addEventListener("click", () => {
      setFontSize(defaultFontSize);
    });

    setFontSize(localStorage.getItem(storageKey) || defaultFontSize);
  </script>
</body>
</html>
