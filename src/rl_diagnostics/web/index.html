<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RL Experiment Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <strong>RL Experiment Console</strong>
        <span id="connectionStatus">正在连接</span>
      </div>
      <div class="top-actions">
        <label class="search-field">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="实验、算法、模型">
        </label>
        <button id="refreshButton" class="command-button" type="button">刷新</button>
      </div>
    </header>

    <aside class="experiment-panel">
      <div class="panel-heading">
        <div>
          <h1>实验</h1>
          <p id="experimentCount">0 个记录</p>
        </div>
        <select id="statusFilter" aria-label="状态筛选">
          <option value="all">全部状态</option>
          <option value="running">运行中</option>
          <option value="completed">已完成</option>
          <option value="completed_with_errors">完成但有尾部错误</option>
          <option value="failed">失败</option>
          <option value="stopped">停止更新</option>
        </select>
      </div>
      <div id="experimentList" class="experiment-list"></div>
    </aside>

    <main id="detail" class="detail-panel">
      <section class="empty-state">
        <h2>选择一个实验</h2>
        <p>查看训练进度、事实标签、指标曲线和 rollout 证据。</p>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
